<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joia</title>
    <link rel="icon" type="image/png" href="imgs/logo.png">
    <link rel="stylesheet" href="./joia.css">
    <link rel="stylesheet" href="./joiaAnimação.css">
    <script type="module" src="./joia.js"></script>
    <script type="module" src="./joiafaixa.js"></script>
</head>

<body>
    <header class="header">
        <div class="card" data-proto-card data-cat="essential">
            <div class="card-stage">
                <div class="stage-inner p16-stage-inner">
                    <div class="p16-tabs" data-proto-tabs role="tablist" aria-label="Mode">
                        <span class="p16-indicator" aria-hidden="true"></span>
                        <button type="button" class="p16-tab" role="tab" aria-selected="true">Plan</button>
                        <button type="button" class="p16-tab" role="tab" aria-selected="false">Debug</button>
                        <button type="button" class="p16-tab" role="tab" aria-selected="false">Ask</button>
                        <button type="button" class="p16-tab" role="tab" aria-selected="false">Ask</button>
                        <button type="button" class="p16-tab" role="tab" aria-selected="false">Ask</button>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main class="main">
        <div class="fundo">
            <video class="video" autoplay muted loop playsinline>
                <source src="./Videos/Video__fundo.mp4" type="video/mp4">

            </video>
        </div>
    </main>

<section class="section">
    <div id="veil"></div>

</section>

    <!-- Precisa rodar em servidor local (ex.: Live Server), pois usa módulos ES -->
    <script type="module">
import { createDitherVeil } from './joiafaixa.js';
        const veil = createDitherVeil('#veil', {
                    src: './imgs/logo.png',

            pattern: 'floyd',
            pixelSize: 2,
            revealRadius: 200,
            wander: true
        });

        // Exemplos:
        // veil.update({ pattern: 'bayer', rim: 0.3 });
        // veil.update({ src: 'minha-imagem.jpg' });
        // veil.destroy();
    </script>
</body>

</html>
