<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joia</title>
    <link rel="icon" type="image/png" href="imgs/logo.png">
    <link rel="stylesheet" href="./joia.css">
    <link rel="stylesheet" href="./joiaAnimação.css">
    <script type="module" src="./joia.js"></script>
    <script type="module" src="./joiafaixa.js"></script>
    <script type="module" src="./joianimada.js"></script>
    <script type="module" src="./cardInfinito.js"></script>


</head>

<body>
    <header class="header">
        <div class="logo__site">
            <img src="imgs/logo__site.png" alt="">
        </div>

        <div class="card" data-proto-card data-cat="essential">
            <div class="card-stage">
                <div class="stage-inner p16-stage-inner">
                    <div class="p16-tabs" data-proto-tabs role="tablist" aria-label="Mode">
                        <span class="p16-indicator" aria-hidden="true"></span>
                        <button type="button" class="p16-tab" role="tab" aria-selected="true">Inicio</button>
                        <button type="button" class="p16-tab" role="tab" aria-selected="false">Debug</button>
                        <button type="button" class="p16-tab" role="tab" aria-selected="false">Sobre Nós</button>
                        <button type="button" class="p16-tab" role="tab" aria-selected="false">Ask</button>
                        <button type="button" class="p16-tab" role="tab" aria-selected="false">Contatos</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="input">
            <input type="text">
        </div>
    </header>
    <main class="main">
        <div class="gradiente">

        </div>
        <div class="fundo">
            <video class="video" autoplay muted loop playsinline>
                <source src="./Videos/Video__fundo.mp4" type="video/mp4">
            </video>
        </div>
        <div class="texto">

        </div>
    </main>

    <section class="section">
        <div class="fundo__diamante">
            <img src="imgs/fundo__diamantão.png" alt="">
        </div>

        <div id="veil"></div>

        <section class="faixa">
            <div id="faixa"></div>
        </section>
    </section>


    <section class="cards__infinitos">
        <div class="fundo__do__infinito">
            <img src="imgs/fundo__cards__infinitos.png" alt="">
        </div>

        <div id="spiral"></div>

    </section>



    <!-- Precisa rodar em servidor local (ex.: Live Server), pois usa módulos ES -->
    <script type="module">
        import { createDitherVeil } from './joianimada.js';
        const veil = createDitherVeil('#veil', {
            src: './imgs/logo.png',

            pattern: 'floyd',
            pixelSize: 1,
            revealRadius: 200,
            wander: true,
            transparent: true,
        });

        // Exemplos:
        // veil.update({ pattern: 'bayer', rim: 0.3 });
        // veil.update({ src: 'minha-imagem.jpg' });
        // veil.destroy();
    </script>

    <script type="module">
        import { createTextLoop } from './joiafaixa.js';
        const faixa = createTextLoop('#faixa', {
            text: 'JOIA ✦ LIRIA',
            shape: 'wave',
            speed: 90,
            ribbonColor: '#ff0000'
        });

        // faixa.update({ shape: 'infinity', cross: true });
        // faixa.destroy();
    </script>

    <script type="module">

    </script>
</body>

</html>
